<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Rings</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:#fffdf8;font-family:"Poppins","Noto Sans TC","Microsoft JhengHei",sans-serif}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* 選單：右上角圓鈕 + 可收合面板 */
  #toggle{position:fixed;top:18px;right:18px;z-index:4;width:44px;height:44px;border:0;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.18);
    display:grid;place-items:center;transition:transform .2s,opacity .3s;opacity:.85}
  #toggle:hover{transform:scale(1.08);opacity:1}
  #toggle i{display:block;width:4px;height:4px;border-radius:50%;background:#141414;box-shadow:-8px 0 #141414,8px 0 #141414}
  #panel{position:fixed;top:70px;right:18px;z-index:4;width:236px;padding:14px;border-radius:20px;
    background:rgba(255,255,255,.88);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.2);
    transition:opacity .25s,transform .25s,visibility .25s}
  #panel.hide{opacity:0;transform:translateY(-8px) scale(.97);visibility:hidden}
  #panel .row{display:flex;gap:8px;margin-bottom:12px}
  #panel .row:last-child{margin-bottom:0}
  .src{flex:1;height:42px;border:0;border-radius:12px;background:#f1efe9;font-size:18px;cursor:pointer;transition:transform .15s}
  .src:hover{transform:translateY(-2px)}
  .src.on{background:#141414;filter:none}
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sw{aspect-ratio:1;border:3px solid transparent;border-radius:50%;cursor:pointer;transition:transform .15s;outline:0;padding:0}
  .sw:hover{transform:scale(1.08)}
  .sw.on{border-color:#141414;box-shadow:0 0 0 2px #fff inset}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;max-width:86vw;padding:10px 16px;border-radius:12px;
    background:#141414;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
  #toast.show{opacity:.92}
  #enter{position:fixed;inset:0;z-index:5;display:grid;place-items:center;cursor:pointer;background:#fffdf8;transition:opacity .7s,visibility .7s}
  #enter.gone{opacity:0;visibility:hidden}
  #enter b{width:46px;height:46px;border-radius:50%;background:#141414;animation:p 1.4s ease-in-out infinite}
  @keyframes p{50%{transform:scale(1.6)}}
  input[type=file]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle" aria-label="選單"><i></i></button>
<div id="panel" class="hide">
  <div class="row" id="srcs">
    <button class="src on" data-src="demo" title="示範音樂">♪</button>
    <button class="src" data-src="loop" title="系統聲音（免共用，使用「立體聲混音」裝置）">🔊</button>
    <button class="src" data-src="system" title="系統聲音（螢幕共用並勾選音訊）">🖥</button>
    <button class="src" data-src="mic" title="麥克風">🎤</button>
    <button class="src" data-src="file" title="音樂檔">📁</button>
  </div>
  <div class="row"><button class="src" id="fs" title="全螢幕（F）" style="font-size:15px;font-weight:600">⛶ 全螢幕</button></div>
  <div class="row"><div class="themes" id="themes" style="width:100%"></div></div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*">
<div id="enter"><b></b></div>

<script>
/* ───────── 配色風格 ───────── */
const THEMES=[
  {name:"金黃", bg:"#fffdf8", text:"#fffdf0", ramp:["#b08f1c","#efcb35"]},
  {name:"玫瑰", bg:"#fff8f8", text:"#fff6f7", ramp:["#b8476a","#f29bb0"]},
  {name:"海洋", bg:"#f3fbfc", text:"#f4feff", ramp:["#0f5d80","#47bccb"]},
  {name:"森林", bg:"#f7fbf5", text:"#f6fff4", ramp:["#2f6b4f","#86c796"]},
  {name:"日落", bg:"#fff9f3", text:"#fff7ee", ramp:["#8a2f5a","#f29a55"]},
  {name:"石墨", bg:"#f4f4f2", text:"#ffffff", ramp:["#262626","#9a9a9a"]},
  {name:"紫霧", bg:"#faf8ff", text:"#fbf9ff", ramp:["#4f4199","#b3a6ea"]}
];
let theme=THEMES[0];
try{ const s=localStorage.getItem("ringTheme"); if(s&&THEMES[+s]) theme=THEMES[+s]; }catch{}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function ramp(t,u){ const a=hex(t.ramp[0]),b=hex(t.ramp[1]); return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*u)).join(",")})`; }
function swatchBg(t){
  const cols=[0,.25,.5,.75,1].map(u=>ramp(t,u));
  return `conic-gradient(${cols.map((c,i)=>`${c} ${i*20}% ${(i+1)*20}%`).join(",")})`;
}
const $themes=document.getElementById("themes");
THEMES.forEach((t,i)=>{
  const b=document.createElement("button"); b.className="sw"+(t===theme?" on":""); b.title=t.name; b.style.background=swatchBg(t);
  b.onclick=()=>{theme=t; $themes.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b)); try{localStorage.setItem("ringTheme",i)}catch{} };
  $themes.appendChild(b);
});
const panel=document.getElementById("panel");
const toggleMenu=()=>panel.classList.toggle("hide");
document.getElementById("toggle").onclick=toggleMenu;
function toggleFullscreen(){
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  const el=document.documentElement;
  (el.requestFullscreen||el.webkitRequestFullscreen).call(el).then?.(()=>panel.classList.add("hide")).catch(()=>toast("無法進入全螢幕"));
}
document.getElementById("fs").onclick=toggleFullscreen;
addEventListener("keydown",e=>{ if(e.key==="h"||e.key==="H") toggleMenu(); if(e.key==="f"||e.key==="F") toggleFullscreen(); });
const $toast=document.getElementById("toast"); let toastT;
function toast(t){ $toast.textContent=t; $toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>$toast.classList.remove("show"),4500); }

/* ───────── 音訊 ───────── */
const BAND_HZ=2000, RINGS=10;               // 每圈 2kHz，共 0–20kHz
let ctx, analyser, freq, srcNode=null, stream=null, demoTimer=null, master=null, audioEl=null;
const edges=[]; let level=0, autoMax=.2, bassAvg=0, kick=0;
const E=new Float32Array(RINGS);

function initAudio(){
  if(ctx) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=ctx.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=.6;
  freq=new Uint8Array(analyser.frequencyBinCount);
  const binW=ctx.sampleRate/2/analyser.frequencyBinCount;
  for(let i=0;i<=RINGS;i++){
    edges.push(Math.min(analyser.frequencyBinCount-1,Math.max(1,Math.round(i*BAND_HZ/binW))));
  }
}
function clearSource(){
  if(demoTimer){clearInterval(demoTimer);demoTimer=null}
  if(master){try{master.disconnect()}catch{} master=null}
  if(srcNode){try{srcNode.disconnect()}catch{} srcNode=null}
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null}
  if(audioEl){audioEl.pause(); audioEl=null}
  try{analyser.disconnect()}catch{}
}
function startDemo(){
  clearSource();
  master=ctx.createGain(); master.gain.value=.8; master.connect(analyser); analyser.connect(ctx.destination);
  const bpm=116, spb=60/bpm; let next=ctx.currentTime+.1, step=0;
  const roots=[55,43.65,49,41.2];
  const nb=(()=>{const b=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})();
  const kickF=t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
    g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(master);o.start(t);o.stop(t+.4)};
  const noise=(t,hp,dur,vol)=>{const s=ctx.createBufferSource();s.buffer=nb;const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur)};
  const tone=(t,fr,dur,type,vol,cut)=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.value=fr;
    f.type="lowpass";f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(cut/4,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.05)};
  const sched=()=>{ while(next<ctx.currentTime+.25){
    const bar=Math.floor(step/16)%4, s=step%16, root=roots[bar];
    if(s%4===0) kickF(next);
    if(s%8===4) noise(next,1500,.18,.5);
    if(s%2===1) noise(next,7000,.05,.22);
    if(s%2===0) tone(next,root*2*[1,1.5,2,1.5,1.25,1.5,2,3][(s/2)%8],spb/2,"sawtooth",.18,2400);
    if(s%16===0) [1,1.25,1.5].forEach(m=>tone(next,root*4*m,spb*3.5,"triangle",.1,3000));
    if(s%4===2) tone(next,root,spb/2,"square",.16,500);
    next+=spb/4; step++; } };
  demoTimer=setInterval(sched,60); sched();
}
async function startStream(kind){
  clearSource();
  try{
    if(kind==="loop"){
      // 免共用：用 Windows 的「立體聲混音」(Stereo Mix) 這類回錄裝置，直接收系統播放的聲音
      const tmp=await navigator.mediaDevices.getUserMedia({audio:true}); tmp.getTracks().forEach(t=>t.stop());   // 先取得權限才看得到裝置名稱
      const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="audioinput");
      const dev=devs.find(d=>/stereo mix|立體聲混音|立体声混音|what u hear|loopback|wave out|cable output|voicemeeter/i.test(d.label));
      if(!dev){ toast("找不到系統回錄裝置：請在 Windows「音效設定 → 錄製」顯示已停用的裝置，並啟用「立體聲混音」"); return false; }
      stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:dev.deviceId},echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      toast("使用裝置："+dev.label); watchSignal();
    }else if(kind==="system"){
      stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      if(!stream.getAudioTracks().length){
        stream.getTracks().forEach(t=>t.stop()); stream=null;
        toast("沒有音訊：請選「整個螢幕」或分頁，並勾選「分享系統／分頁音訊」"); return false;
      }
      watchSignal();
    }else{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }
    audioEl=new Audio(); audioEl.srcObject=stream; audioEl.muted=true; audioEl.play().catch(()=>{});
    srcNode=ctx.createMediaStreamSource(stream); srcNode.connect(analyser);
    return true;
  }catch(e){ toast("無法取得音源："+(e.name||e.message)); return false; }
}
let watchId=0;
function watchSignal(){
  const id=++watchId, t=performance.now();
  const iv=setInterval(()=>{
    if(id!==watchId||level>.02){clearInterval(iv);return}
    if(performance.now()-t>4000){ toast("收不到聲音：分享時選「整個螢幕」並勾選「分享系統音訊」，且影片要正在出聲"); clearInterval(iv); }
  },300);
}
function startFile(file){
  clearSource();
  audioEl=new Audio(URL.createObjectURL(file)); audioEl.loop=true;
  srcNode=ctx.createMediaElementSource(audioEl); srcNode.connect(analyser); analyser.connect(ctx.destination);
  audioEl.play();
}
const fileIn=document.getElementById("file"), srcs=document.getElementById("srcs");
const mark=k=>srcs.querySelectorAll(".src").forEach(b=>b.classList.toggle("on",b.dataset.src===k));
srcs.addEventListener("click",async e=>{
  const k=e.target.dataset?.src; if(!k) return;
  initAudio(); await ctx.resume();
  if(k==="demo"){startDemo();mark(k)} else if(k==="file") fileIn.click(); else if(await startStream(k)) mark(k);
});
fileIn.addEventListener("change",()=>{ if(fileIn.files[0]){startFile(fileIn.files[0]);mark("file")} });
const enter=document.getElementById("enter");
enter.addEventListener("click",async()=>{initAudio();await ctx.resume();startDemo();enter.classList.add("gone")},{once:true});

/* ───────── 視覺：滿版、相接的實心同心圓 ───────── */
const cv=document.getElementById("c"), g=cv.getContext("2d");
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; }
addEventListener("resize",resize); resize();

const LABELS=Array.from({length:RINGS},(_,i)=>({full:`${i*BAND_HZ/1000}–${(i+1)*BAND_HZ/1000} kHz`, short:`${(i+1)*BAND_HZ/1000}k`}));
const SMALL=3;                                   // 最內 3 圈的文字縮小
const GAP=Math.PI*2*.01;                         // 每圈開口 = 圓周的 1%
const FONT=`"Poppins","Noto Sans TC","Microsoft JhengHei",sans-serif`;
const rings=Array.from({length:RINGS},(_,i)=>({dir:i%2?-1:1, angle:Math.random()*6.28, vel:0, chars:[], rad:0}));
let geo={r0:0,step:0,font:12,base:new Float32Array(RINGS)};
const SHRINK=.8;                                 // 最內圈寬度縮小 80%，往外逐圈線性減少，最外圈不縮
function layout(){
  const maxR=Math.hypot(W,H)/2; geo.r0=maxR*.035;          // 中心空圓直徑再縮小 50%
  const fac=Array.from({length:RINGS},(_,i)=>1-SHRINK*(1-i/(RINGS-1)));
  const unitW=(maxR-geo.r0)/fac.reduce((a,b)=>a+b,0); geo.step=unitW;
  fac.forEach((f,i)=>geo.base[i]=unitW*f);                   // 各圈基本寬度，總和仍填滿畫面
  g.setTransform(1,0,0,1,0,0);
  let edge0=geo.r0;
  for(let i=0;i<RINGS;i++){
    const rad=edge0+geo.base[i]/2; edge0+=geo.base[i]; const avail=Math.PI*2-GAP-.12;
    const fs=Math.max(8,i<SMALL?geo.base[i]*.55:geo.base[i]*1.35);            // 內三圈字縮小，完整留在圈內
    rings[i].font=fs; g.font=`900 ${fs}px ${FONT}`;
    const wid=t=>[...t].map(c=>g.measureText(c).width/rad);
    const sep=fs*.8/rad;
    let unit=LABELS[i].full, ws=wid(unit), tot=ws.reduce((a,b)=>a+b,0)+sep, k=Math.floor(avail/tot);
    if(k<1){ unit=LABELS[i].short; ws=wid(unit); tot=ws.reduce((a,b)=>a+b,0)+sep; k=Math.floor(avail/tot); }
    const out=[];
    if(k<1){ let a=GAP+.06; for(let j=0;j<ws.length&&a+ws[j]<Math.PI*2-.06;j++){out.push({ch:unit[j],a:a+ws[j]/2});a+=ws[j]} }
    else{
      const tw=ws.reduce((x,y)=>x+y,0); let a=GAP+(Math.PI*2-GAP-tw)/2;   // 每圈只放一個標籤，置中於開口以外的弧
      [...unit].forEach((c,j)=>{out.push({ch:c,a:a+ws[j]/2});a+=ws[j]});
    }
    rings[i].chars=out; rings[i].rad=rad;
  }
}
layout();
addEventListener("resize",layout);
let last=performance.now(), dom=0, lastBeat=0, hitPrev=false;
const WIDEN=.10, FALL=.6;                       // 最大音量圈加寬 10%；鄰圈擠壓每往外一圈衰減至 60%
const grow=new Float32Array(RINGS), growV=new Float32Array(RINGS);
function analyse(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freq);
  let peak=0; const raw=new Float32Array(RINGS);
  for(let i=0;i<RINGS;i++){
    let s=0,n=0; for(let b=edges[i];b<=Math.max(edges[i],edges[i+1]-1);b++){s+=freq[b];n++}
    let v=s/Math.max(n,1)/255; v*=1+i*(6/RINGS);
    raw[i]=v; peak=Math.max(peak,v);
  }
  level=level*.8+peak*.2;
  autoMax=Math.max(autoMax*.997,peak,.1);
  for(let i=0;i<RINGS;i++){
    const v=Math.pow(Math.min(raw[i]/autoMax,1),1.5);
    E[i]=v>E[i]? E[i]+(v-E[i])*.6 : E[i]+(v-E[i])*.12;
  }
  const bass=(freq[1]+freq[2]+freq[3]+freq[4])/4/255;
  bassAvg=bassAvg*.95+bass*.05;
  const hit=bass>bassAvg*1.25+.08;
  kick=hit?Math.min(1,(bass-bassAvg)*4):kick*.88;
  const tn=performance.now();
  if((hit&&!hitPrev&&tn-lastBeat>180)||tn-lastBeat>700){ // 每一拍：鎖定當下音量最大的那一圈
    lastBeat=tn; let m=0; for(let i=1;i<RINGS;i++) if(E[i]>E[m]) m=i; dom=m;
  }
  hitPrev=hit;
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  analyse();
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=theme.bg; g.fillRect(0,0,W,H);
  const {r0,step,font}=geo;
  // 圈寬：最大音量圈 +10%，其餘圈被擠壓（相鄰最多、愈外愈少），總寬度不變
  const base=geo.base, wts=new Float32Array(RINGS); let wsum=0;
  for(let j=0;j<RINGS;j++){ if(j!==dom){ wts[j]=Math.pow(FALL,Math.abs(j-dom)-1)*base[j]; wsum+=wts[j]; } }
  for(let j=0;j<RINGS;j++){
    const t=j===dom?WIDEN*base[dom]:-WIDEN*base[dom]*(wsum?wts[j]/wsum:0);
    growV[j]+=(t-grow[j])*.14; growV[j]*=.78; grow[j]+=growV[j];
  }
  let edge=r0; const widths=new Float32Array(RINGS), mids=new Float32Array(RINGS);
  for(let j=0;j<RINGS;j++){ widths[j]=Math.max(1,base[j]+grow[j]); mids[j]=edge+widths[j]/2; edge+=widths[j]; }
  g.save(); g.translate(W/2,H/2);
  g.textAlign="center"; g.textBaseline="middle";
  for(let i=0;i<RINGS;i++){
    const R=rings[i], e=E[i], rad=mids[i];
    R.vel+=(R.dir*(.035+e*.55)-R.vel)*Math.min(1,dt*3);     // 音量 → 旋轉速度（慢）
    R.angle+=R.vel*dt;
    g.beginPath(); g.arc(0,0,rad,R.angle+GAP,R.angle+Math.PI*2);   // 固定顏色、固定寬度，留一個開口
    g.strokeStyle=ramp(theme,i/(RINGS-1)); g.lineWidth=widths[i]+1.2; g.lineCap="butt"; g.stroke();
    g.font=`900 ${R.font}px ${FONT}`;
    g.save(); g.beginPath();                                       // 文字只留在自己的圈內，超出的截掉
    g.arc(0,0,rad+widths[i]/2,0,Math.PI*2); g.arc(0,0,Math.max(0,rad-widths[i]/2),0,Math.PI*2,true); g.clip("evenodd");
    g.fillStyle=theme.text; g.globalAlpha=.62+e*.38;                // 頻段文字沿圈排列、跟著轉
    for(const c of R.chars){
      const a=c.a+R.angle;
      g.save(); g.translate(Math.cos(a)*rad,Math.sin(a)*rad); g.rotate(a+Math.PI/2); g.fillText(c.ch,0,0); g.restore();
    }
    g.globalAlpha=1; g.restore();
  }
  g.beginPath(); g.arc(0,0,r0,0,7); g.fillStyle=theme.bg; g.fill();   // 中心空圓
  g.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
